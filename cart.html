<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | NEEZA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="footer.css">
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>


    <!-- CART HERO -->
    <section class="shop-hero">
        <div class="container text-center">
            <p class="text-uppercase mb-2">NEEZA</p>
            <h1>Your Cart</h1>
            <p>Review your selected products before checkout.</p>
        </div>
    </section>


    <!-- CART -->
    <section class="py-5">
        <div class="container">

            <div class="row g-4">

                <!-- CART ITEMS -->
                <div class="col-lg-8">

                    <div class="card border-0 shadow-sm">
                        <div class="card-body">

                            <h4 class="fw-bold mb-4">
                                Shopping Cart
                            </h4>

                            <div id="cartItems">
                                <!-- Cart products will appear here -->
                            </div>

                        </div>
                    </div>

                </div>


                <!-- SUMMARY -->
                <div class="col-lg-4">

                    <div class="card border-0 shadow-sm">
                        <div class="card-body">

                            <h4 class="fw-bold mb-4">
                                Order Summary
                            </h4>

                            <div class="d-flex justify-content-between mb-3">
                                <span>Subtotal</span>
                                <span id="cartSubtotal">PKR 0</span>
                            </div>

                            <div class="d-flex justify-content-between mb-3">
                                <span>Shipping</span>
                                <span id="cartShipping">PKR 0</span>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between mb-4">
                                <strong>Total</strong>
                                <strong id="cartTotal">PKR 0</strong>
                            </div>

                            <a href="checkout.html"
                               class="btn btn-dark w-100 py-3">
                                Proceed to Checkout
                                <i class="fa-solid fa-arrow-right ms-2"></i>
                            </a>

                            <a href="shop.html"
                               class="btn btn-outline-dark w-100 mt-2 py-3">
                                Continue Shopping
                            </a>

                        </div>
                    </div>

                </div>

            </div>

        </div>
    </section>


    <!-- FOOTER -->
    <div id="footer"></div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 
    <script src="products.js"></script>
<script src="cart.js"></script>
<script src="navbar.js"></script>
<script src="footer.js"></script>
<script src="main.js"></script>

</body>
</html>
