<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | NEEZA</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Navbar CSS -->
    <link rel="stylesheet" href="navbar.css">

    <!-- Footer CSS -->
    <link rel="stylesheet" href="footer.css">
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>


    <!-- SHOP HERO -->
    <section class="shop-hero">
        <div class="container text-center">
            <p class="text-uppercase mb-2">Explore NEEZA</p>
            <h1>Our Collection</h1>
            <p>
                Discover modern styles made for everyday confidence.
            </p>
        </div>
    </section>


    <!-- SHOP CONTENT -->
    <section class="py-5">
        <div class="container">

            <div class="row mb-4 align-items-center">
                <div class="col-md-6">
                    <h2 class="fw-bold mb-1">Shop All</h2>
                    <p class="text-muted mb-0">
                        Find your favorite pieces from our latest collection.
                    </p>
                </div>

                <div class="col-md-6 text-md-end mt-3 mt-md-0">
                    <select id="sortProducts" class="form-select d-inline-block"
                            style="max-width:220px;">
                        <option value="default">Sort By</option>
                        <option value="low">Price: Low to High</option>
                        <option value="high">Price: High to Low</option>
                        <option value="name">Name: A-Z</option>
                    </select>
                </div>
            </div>


            <!-- CATEGORY BUTTONS -->
            <div class="text-center mb-5">
                <a href="shop.html" class="btn btn-dark me-2 mb-2">
                    All
                </a>

                <a href="tshirts.html" class="btn btn-outline-dark me-2 mb-2">
                    T-Shirts
                </a>

                <a href="shirts.html" class="btn btn-outline-dark me-2 mb-2">
                    Shirts
                </a>

                <a href="trousers.html" class="btn btn-outline-dark mb-2">
                    Trousers
                </a>
            </div>


            <!-- PRODUCTS -->
            <div class="row g-4" id="productContainer">
                <!-- Products will be loaded from products.js -->
            </div>

        </div>
    </section>


    <!-- FOOTER -->
    <div id="footer"></div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 <script src="products.js"></script>
<script src="navbar.js"></script>
<script src="footer.js"></script>
<script src="main.js"></script>
<script src="shop.js"></script>
</body>
</html>
