<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wishlist | NEEZA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="footer.css">
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>


    <!-- WISHLIST HERO -->
    <section class="shop-hero">
        <div class="container text-center">
            <p class="text-uppercase mb-2">NEEZA</p>

            <h1>My Wishlist</h1>

            <p>
                Save your favorite products and shop them anytime.
            </p>
        </div>
    </section>


    <!-- WISHLIST -->
    <section class="py-5">
        <div class="container">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <h2 class="fw-bold mb-1">
                        Wishlist
                    </h2>

                    <p class="text-muted mb-0">
                        Your saved products.
                    </p>
                </div>

                <a href="shop.html"
                   class="btn btn-outline-dark">

                    <i class="fa-solid fa-arrow-left me-2"></i>
                    Continue Shopping

                </a>

            </div>


            <!-- WISHLIST PRODUCTS -->
            <div class="row g-4"
                 id="wishlistContainer">

                <!-- Wishlist products will appear here -->

            </div>


            <!-- EMPTY WISHLIST MESSAGE -->
            <div id="emptyWishlist"
                 class="text-center py-5"
                 style="display:none;">

                <i class="fa-regular fa-heart fa-3x mb-3"></i>

                <h4 class="fw-bold">
                    Your wishlist is empty
                </h4>

                <p class="text-muted">
                    Add products you love to your wishlist.
                </p>

                <a href="shop.html"
                   class="btn btn-dark px-4">

                    Start Shopping

                </a>

            </div>

        </div>
    </section>


    <!-- FOOTER -->
    <div id="footer"></div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="products.js"></script>
<script src="navbar.js"></script>
<script src="footer.js"></script>
<script src="wishlist.js"></script>
<script src="main.js"></script>

</body>
</html>
