<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product | NEEZA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="footer.css">
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>


    <!-- PRODUCT DETAILS -->
    <section class="py-5">
        <div class="container">

            <div class="row g-5 align-items-center" id="productDetails">

                <!-- Product image -->
                <div class="col-lg-6">
                    <div class="product-detail-image">
                        <img id="productImage"
                             src=""
                             alt="Product"
                             class="img-fluid w-100">
                    </div>
                </div>


                <!-- Product information -->
                <div class="col-lg-6">

                    <p class="text-uppercase text-muted mb-2" id="productCategory">
                        NEEZA
                    </p>

                    <h1 class="fw-bold mb-3" id="productName">
                        Product Name
                    </h1>

                    <h3 class="fw-bold mb-4" id="productPrice">
                        PKR 0
                    </h3>

                    <p class="text-muted mb-4" id="productDescription">
                        Product description will appear here.
                    </p>

                    <!-- SIZE -->
<div class="mb-4">
    <label class="fw-semibold d-block mb-2">
        Size:
    </label>

    <div id="productSizes" class="d-flex flex-wrap gap-2">
        <!-- Sizes will load here -->
    </div>
</div>


<!-- COLOR -->
<div class="mb-4">
    <label class="fw-semibold d-block mb-2">
        Color:
    </label>

    <div id="productColors" class="d-flex flex-wrap gap-2">
        <!-- Colors will load here -->
    </div>
</div>


                    <!-- Quantity -->
                    <div class="d-flex align-items-center gap-3 mb-4">

                        <label for="quantity" class="fw-semibold">
                            Quantity:
                        </label>

                        <input type="number"
                               id="quantity"
                               class="form-control"
                               value="1"
                               min="1"
                               style="width:90px;">

                    </div>


                    <!-- Buttons -->
                    <div class="d-flex flex-wrap gap-2">

                        <button class="btn btn-dark px-4 py-3"
                                id="addToCartBtn">
                            <i class="fa-solid fa-cart-shopping me-2"></i>
                            Add to Cart
                        </button>

                        <button class="btn btn-outline-dark px-4 py-3"
                                id="wishlistBtn">
                            <i class="fa-regular fa-heart me-2"></i>
                            Wishlist
                        </button>

                    </div>

                </div>

            </div>

        </div>
    </section>


    <!-- FOOTER -->
    <div id="footer"></div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

   <script src="products.js"></script>
<script src="product.js"></script>
<script src="navbar.js"></script>
<script src="footer.js"></script>
<script src="main.js"></script>

</body>
</html>
