<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | NEEZA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="footer.css">
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>


    <!-- CHECKOUT HERO -->
    <section class="shop-hero">
        <div class="container text-center">
            <p class="text-uppercase mb-2">NEEZA</p>
            <h1>Checkout</h1>
            <p>Complete your order securely.</p>
        </div>
    </section>


    <!-- CHECKOUT -->
    <section class="py-5">
        <div class="container">

            <div class="row g-4">

                <!-- CUSTOMER INFORMATION -->
                <div class="col-lg-7">

                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-4">

                            <h4 class="fw-bold mb-4">
                                Delivery Information
                            </h4>

                            <form id="checkoutForm">

                                <div class="row g-3">

                                    <div class="col-md-6">
                                        <label class="form-label">
                                            First Name
                                        </label>

                                        <input type="text"
                                               class="form-control"
                                               id="firstName"
                                               required>
                                    </div>


                                    <div class="col-md-6">
                                        <label class="form-label">
                                            Last Name
                                        </label>

                                        <input type="text"
                                               class="form-control"
                                               id="lastName"
                                               required>
                                    </div>


                                    <div class="col-12">
                                        <label class="form-label">
                                            Email Address
                                        </label>

                                        <input type="email"
                                               class="form-control"
                                               id="email"
                                               required>
                                    </div>


                                    <div class="col-12">
                                        <label class="form-label">
                                            Phone Number
                                        </label>

                                        <input type="tel"
                                               class="form-control"
                                               id="phone"
                                               placeholder="03XX-XXXXXXX"
                                               required>
                                    </div>


                                    <div class="col-12">
                                        <label class="form-label">
                                            Address
                                        </label>

                                        <input type="text"
                                               class="form-control"
                                               id="address"
                                               required>
                                    </div>


                                    <div class="col-md-6">
                                        <label class="form-label">
                                            City
                                        </label>

                                        <select class="form-select"
                                                id="city"
                                                required>

                                            <option value="">
                                                Select City
                                            </option>

                                            <option value="Karachi">
                                                Karachi
                                            </option>

                                            <option value="Lahore">
                                                Lahore
                                            </option>

                                            <option value="Islamabad">
                                                Islamabad
                                            </option>

                                            <option value="Rawalpindi">
                                                Rawalpindi
                                            </option>

                                            <option value="Faisalabad">
                                                Faisalabad
                                            </option>

                                        </select>
                                    </div>


                                    <div class="col-md-6">
                                        <label class="form-label">
                                            Postal Code
                                        </label>

                                        <input type="text"
                                               class="form-control"
                                               id="postalCode"
                                               required>
                                    </div>

                                </div>


                                <!-- PAYMENT -->
                                <!-- PAYMENT -->
<h4 class="fw-bold mt-5 mb-4">
    Payment Method
</h4>

<div class="form-check border rounded p-3">

    <input class="form-check-input"
           type="radio"
           name="payment"
           id="jazzcash"
           value="jazzcash"
           checked>

    <label class="form-check-label"
           for="jazzcash">

        <strong>
            <i class="fa-solid fa-mobile-screen-button me-2"></i>
            JazzCash
        </strong>

        <div class="text-muted small mt-1">
            Pay securely using JazzCash.
        </div>

    </label>

</div>

   <button type="submit"
         class="btn btn-dark w-100 py-3 mt-4">

      Place Order
     <i class="fa-solid fa-check ms-2"></i>

        </button>
    </form>

       </div>
                    </div>

                </div>


                <!-- ORDER SUMMARY -->
                <div class="col-lg-5">

                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-4">

                            <h4 class="fw-bold mb-4">
                                Your Order
                            </h4>

                            <div id="checkoutItems">
                                <!-- Checkout items -->
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between mb-3">
                                <span>Subtotal</span>
                                <span id="checkoutSubtotal">
                                    PKR 0
                                </span>
                            </div>

                            <div class="d-flex justify-content-between mb-3">
                                <span>Shipping</span>
                                <span id="checkoutShipping">
                                    PKR 0
                                </span>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between">
                                <strong>Total</strong>

                                <strong id="checkoutTotal">
                                    PKR 0
                                </strong>
                            </div>

                        </div>
                    </div>

                </div>

            </div>

        </div>
    </section>


    <!-- FOOTER -->
    <div id="footer"></div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="products.js"></script>
<script src="checkout.js"></script>
<script src="navbar.js"></script>
<script src="footer.js"></script>
<script src="main.js"></script>

</body>
</html>
